# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Nothka/NoulTestament
  branch: main

site_url: https://www.noultestament.ro
display_url: https://www.noultestament.ro

media_folder: public/uploads
public_folder: /uploads

editor:
  preview: false

collections:
  - name: introduction
    label: Introducere
    files:
      - name: introduction
        label: Introducere
        file: public/content/introduction.json
        format: json
        fields:
          - { label: ID, name: id, widget: string, hint: "Nu modifica acest câmp." }
          - { label: Titlu meniu, name: title, widget: string }
          - { label: Mărime titlu (%), name: titleSize, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Aliniere titlu, name: titleAlign, widget: string, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu deasupra titlu, name: titleSpaceBefore, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu sub titlu, name: titleSpaceAfter, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare titlu pe orizontală (%), name: titleOffsetX, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare titlu pe verticală (rem), name: titleOffsetY, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Subtitlu, name: subtitle, widget: string, required: false }
          - { label: Mărime subtitlu (%), name: subtitleSize, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Aliniere subtitlu, name: subtitleAlign, widget: string, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu deasupra subtitlu, name: subtitleSpaceBefore, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu sub subtitlu, name: subtitleSpaceAfter, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare subtitlu pe orizontală (%), name: subtitleOffsetX, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare subtitlu pe verticală (rem), name: subtitleOffsetY, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - label: Paragrafe
            name: blocks
            widget: list
            collapsed: true
            summary: "{{fields.text}}"
            fields:
              - label: Tip
                name: type
                widget: select
                options:
                  - { label: Subtitlu, value: heading }
                  - { label: Paragraf, value: paragraph }
                  - { label: Verset, value: verse }
              - label: Text
                name: text
                widget: text
                hint: "Italic: _text_. Bold: **text**. Nu șterge semnele * folosite pentru note."
              - { label: Rând ascuns, name: hidden, widget: boolean, required: false, hint: "Se schimbă din pagina de editare." }
              - label: Referințe note
                name: noteRefs
                widget: list
                required: false
                field: { label: Număr notă, name: noteRef, widget: number, value_type: int }
              - { label: Mărime (%), name: size, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Aliniere, name: align, widget: string, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Spațiu deasupra, name: spaceBefore, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Spațiu dedesubt, name: spaceAfter, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Deplasare pe orizontală (%), name: offsetX, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Deplasare pe verticală (rem), name: offsetY, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }

  - name: books
    label: Cărți
    folder: public/content/books
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: navTitle
    summary: "{{navTitle}}"
    fields:
      - { label: ID, name: id, widget: string, hint: "Nu modifica acest câmp." }
      - { label: Titlu în meniu, name: navTitle, widget: string }
      - { label: Titlu complet, name: title, widget: string }
      - { label: Mărime nume carte (%), name: titleSize, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
      - { label: Aliniere nume carte, name: titleAlign, widget: string, required: false, hint: "Se schimbă din pagina de editare." }
      - { label: Spațiu deasupra nume carte, name: titleSpaceBefore, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
      - { label: Spațiu sub nume carte, name: titleSpaceAfter, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
      - { label: Deplasare nume carte pe orizontală (%), name: titleOffsetX, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
      - { label: Deplasare nume carte pe verticală (rem), name: titleOffsetY, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
      - label: Pasaje
        name: passages
        widget: list
        collapsed: true
        summary: "{{fields.number}}. {{fields.title}}"
        fields:
          - { label: ID, name: id, widget: string, hint: "Nu modifica acest câmp." }
          - { label: Număr pasaj, name: number, widget: number, value_type: int }
          - { label: Referință, name: reference, widget: string, required: false }
          - { label: Mărime referință (%), name: referenceSize, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Aliniere referință, name: referenceAlign, widget: string, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu deasupra referință, name: referenceSpaceBefore, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu sub referință, name: referenceSpaceAfter, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare referință pe orizontală (%), name: referenceOffsetX, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare referință pe verticală (rem), name: referenceOffsetY, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - label: Titlu pasaj
            name: title
            widget: string
            hint: "Italic: _text_. Bold: **text**."
          - { label: Mărime titlu (%), name: titleSize, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Aliniere titlu, name: titleAlign, widget: string, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu deasupra titlului, name: titleSpaceBefore, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Spațiu sub titlu, name: titleSpaceAfter, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare titlu pe orizontală (%), name: titleOffsetX, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Deplasare titlu pe verticală (rem), name: titleOffsetY, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - { label: Pagină, name: pageNumber, widget: number, value_type: int, required: false }
          - label: Text
            name: blocks
            widget: list
            collapsed: true
            summary: "{{fields.text}}"
            fields:
              - label: Tip
                name: type
                widget: select
                options:
                  - { label: Subtitlu, value: heading }
                  - { label: Paragraf, value: paragraph }
                  - { label: Verset, value: verse }
              - label: Text
                name: text
                widget: text
                hint: "Numărul versetului este prima cifră din text - nu îl șterge. Nu șterge semnele * folosite pentru note."
              - { label: Rând ascuns, name: hidden, widget: boolean, required: false, hint: "Se schimbă din pagina de editare." }
              - label: Referințe note
                name: noteRefs
                widget: list
                required: false
                field: { label: Număr notă, name: noteRef, widget: number, value_type: int }
              - { label: Mărime (%), name: size, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Aliniere, name: align, widget: string, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Spațiu deasupra, name: spaceBefore, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Spațiu dedesubt, name: spaceAfter, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Deplasare pe orizontală (%), name: offsetX, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
              - { label: Deplasare pe verticală (rem), name: offsetY, widget: number, value_type: float, required: false, hint: "Se schimbă din pagina de editare." }
          - label: Note de subsol
            name: notes
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.number}}. {{fields.text}}"
            fields:
              - { label: Număr, name: number, widget: number, value_type: int }
              - label: Text
                name: text
                widget: text
                hint: "Italic: _text_. Bold: **text**."
              - { label: Mărime (%), name: size, widget: number, value_type: int, required: false, hint: "Se schimbă din pagina de editare." }
